<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление активности</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="mobile-container">
        <div class="top-nav-header">
            Управление активностью
        </div>

        <div class="page-content draft-page-content">

            {% if activity %}
            <!-- СТАТУС 2: Черновик создан (после Далее). Только публикация, выбор файлов отключен -->
            <div class="media-section">
                <!-- Блок Фото (друг под другом, без выбора) -->
                <div class="media-block">
                    <label class="input-label">Фото профиля</label>
                    <div class="media-row">
                        <div class="media-preview-box">
                            <img class="media-preview-img"
                                src="{{ activity.preview_image_url or '/static/img/default.png' }}" 
                                alt="Фото профиля"
                                onerror="this.src='/static/img/default.png'">
                        </div>
                        <div class="media-info-box">
                            <span class="media-badge">✓ Фото сохранено</span>
                            <span class="media-subtext">Выбрано на шаге 1</span>
                        </div>
                    </div>
                </div>

                <!-- Блок Видео (друг под другом, без выбора) -->
                <div class="media-block">
                    <label class="input-label">Видео профиля</label>
                    <div class="media-row">
                        <div class="media-preview-box">
                            <video class="media-preview-video" autoplay loop muted playsinline poster="/static/img/default.png">
                                <source src="{{ activity.preview_video_url or '/static/img/default.mp4' }}" type="video/mp4">
                            </video>
                        </div>
                        <div class="media-info-box">
                            <span class="media-badge">✓ Видео сохранено</span>
                            <span class="media-subtext">Выбрано на шаге 1</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Форма публикации: вводятся только требуемые поля для публикации -->
            <form action="/network-activities/publish" method="POST" class="draft-form">
                <input type="hidden" name="activity_id" value="{{ activity.id }}">

                <label class="input-label">Название профиля</label>
                <div class="custom-box">
                    {{ activity.activity_title }}
                </div>

                <label class="input-label">Краткая информация</label>
                <textarea name="activity_description" class="draft-input" rows="3" placeholder="Введите описание активности..."
                    required>{{ activity.activity_description if activity.activity_description != '' else '' }}</textarea>

                <label class="input-label">Средний трафик (Мбит/с)</label>
                <input type="number" name="average_traffic_mbps" class="draft-input"
                    value="{{ activity.average_traffic_mbps if activity.average_traffic_mbps != 0 else '' }}" 
                    placeholder="Например: 25" required min="1">

                <label class="input-label">Макс. задержка (мс)</label>
                <input type="number" name="max_latency_ms" class="draft-input" 
                    value="{{ activity.max_latency_ms if activity.max_latency_ms != 0 else '' }}" 
                    placeholder="Например: 50" required min="1">

                <button type="submit" class="btn-save-outline">Опубликовать</button>
            </form>

            <form action="/network-activities/{{ activity.id }}/delete" method="POST" class="card-delete-form" style="margin-top: 12px;">
                <input type="hidden" name="redirect_to" value="/network-activities/draft">
                <button type="submit" class="btn-discard" onclick="return confirm('Отменить черновик и начать заново?');">
                    Отменить черновик
                </button>
            </form>

            {% else %}
            <!-- СТАТУС 1: Черновика нет. Создание с выбором файлов и картинкой рядом (до Далее) -->
            <form action="/network-activities/create" method="POST" enctype="multipart/form-data" class="draft-form">
                
                <div class="media-section">
                    <!-- Блок Фото: и выбор и картинка вместе рядом -->
                    <div class="media-block">
                        <label class="input-label">Фото профиля</label>
                        <div class="media-row">
                            <div class="media-preview-box">
                                <img id="photoPreview" class="media-preview-img" src="/static/img/default.png" alt="Превью фото">
                            </div>
                            <div class="media-control-box">
                                <label for="photoInput" class="btn-file-picker">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                    <span>Выбрать фото</span>
                                </label>
                                <input type="file" id="photoInput" name="pic" accept="image/*" class="file-native-input" onchange="previewImage(this)">
                                <div id="photoFileName" class="file-name-caption">Файл не выбран</div>
                            </div>
                        </div>
                    </div>

                    <!-- Блок Видео: и выбор и видео вместе рядом -->
                    <div class="media-block">
                        <label class="input-label">Видео профиля</label>
                        <div class="media-row">
                            <div class="media-preview-box">
                                <video id="videoPreview" class="media-preview-video" autoplay loop muted playsinline poster="/static/img/default.png">
                                    <source src="/static/img/default.mp4" type="video/mp4">
                                </video>
                            </div>
                            <div class="media-control-box">
                                <label for="videoInput" class="btn-file-picker">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polygon points="23 7 16 12 23 17 23 7"/>
                                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                                    </svg>
                                    <span>Выбрать видео</span>
                                </label>
                                <input type="file" id="videoInput" name="video" accept="video/*" class="file-native-input" onchange="previewVideo(this)">
                                <div id="videoFileName" class="file-name-caption">Файл не выбран</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ввод: ТОЛЬКО то, что нужно вводить на этом шаге (БЕЗ URL!) -->
                <div class="form-fields-group">
                    <label class="input-label">Название профиля</label>
                    <input type="text" name="activity_title" class="draft-input" placeholder="Введите название активности" required>
                </div>

                <button type="submit" class="btn-save-outline">Далее</button>
            </form>
            {% endif %}

        </div>
    </div>

    <!-- Навигационная панель -->
    <div class="bottom-bar">
        <a href="/network-activities/feed" class="tab-item">
            <svg width="19" height="12" viewBox="0 0 19 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12.6676 6.83355L17.0204 9.73522C17.0832 9.77698 17.1561 9.80093 17.2314 9.80453C17.3067 9.80813 17.3815 9.79124 17.448 9.75567C17.5144 9.7201 17.57 9.66717 17.6087 9.60252C17.6475 9.53787 17.6679 9.46392 17.668 9.38855V2.55855C17.668 2.48524 17.6487 2.41322 17.612 2.34976C17.5752 2.2863 17.5224 2.23366 17.4589 2.19714C17.3953 2.16062 17.3232 2.14152 17.2499 2.14177C17.1765 2.14202 17.1046 2.1616 17.0413 2.19855L12.6676 4.75022M2.66678 1H11.0008C11.9213 1 12.6676 1.74619 12.6676 2.66667V9.33333C12.6676 10.2538 11.9213 11 11.0008 11H2.66678C1.74624 11 0.999985 10.2538 0.999985 9.33333V2.66667C0.999985 1.74619 1.74624 1 2.66678 1Z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            Лента
        </a>
        <a href="/network-activities/draft" class="tab-item active">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0.999985 6.834H12.668M6.83398 1V12.668" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
            Добавление
        </a>
        <a href="/network-activities/catalog" class="tab-item">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M8.5 1V16M1 8.5H16M2.66667 1H14.3333C15.2538 1 16 1.74619 16 2.66667V14.3333C16 15.2538 15.2538 16 14.3333 16H2.66667C1.74619 16 1 15.2538 1 14.3333V2.66667C1 1.74619 1.74619 1 2.66667 1Z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            Плитка
        </a>
    </div>

    <!-- Скрипт мгновенного предпросмотра выбранных файлов -->
    <script>
        function previewImage(input) {
            const file = input.files && input.files[0];
            const nameEl = document.getElementById('photoFileName');
            const imgEl = document.getElementById('photoPreview');
            if (file) {
                nameEl.textContent = file.name;
                imgEl.src = URL.createObjectURL(file);
            } else {
                nameEl.textContent = 'Файл не выбран';
            }
        }

        function previewVideo(input) {
            const file = input.files && input.files[0];
            const nameEl = document.getElementById('videoFileName');
            const videoEl = document.getElementById('videoPreview');
            if (file) {
                nameEl.textContent = file.name;
                videoEl.src = URL.createObjectURL(file);
                videoEl.load();
                videoEl.play().catch(function() {});
            } else {
                nameEl.textContent = 'Файл не выбран';
            }
        }
    </script>
</body>

</html>
