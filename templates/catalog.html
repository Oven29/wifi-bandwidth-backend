<!-- Catalog view with grid and search filter -->
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плитка</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="mobile-container">
        <div class="top-nav-header">
            Каталог активностей
        </div>

        <div class="page-content draft-page-content">

            <form action="/network-activities/catalog" method="GET" class="filter-form">

                <div class="search-wrapper" style="margin-bottom: 16px;">
                    <svg class="search-icon" width="12" height="12" viewBox="0 0 14 14" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M13.0001 13.0001L10.1068 10.1068M11.6667 6.33333C11.6667 9.27885 9.27885 11.6667 6.33333 11.6667C3.38781 11.6667 1 9.27885 1 6.33333C1 3.38781 3.38781 1 6.33333 1C9.27885 1 11.6667 3.38781 11.6667 6.33333Z"
                            stroke="#8F9BB3" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <input type="text" name="search" class="search-bar-custom" placeholder="Поиск по названию..."
                        value="{{ search }}">
                </div>

                <label class="input-label" style="margin-top: 0; text-align: center;">
                    Макс. объем трафика: <span id="slider-val" style="color: var(--accent-cyan); font-size: 14px;">{{
                        filter_traffic or 150 }}</span> Мбит/с
                </label>

                <div class="slider-container">
                    <span class="slider-label">0</span>
                    <input type="range" name="filter_traffic" class="custom-slider" min="0" max="150" step="5"
                        value="{{ filter_traffic or 150 }}"
                        oninput="document.getElementById('slider-val').innerText = this.value">
                    <span class="slider-label">150</span>
                </div>

                <button type="submit" class="btn-save-outline filter-btn">Найти и применить</button>
            </form>

            <div class="catalog-grid">
                {% for item in activities %}
                <div class="card">
                    <a href="/network-activities/feed?activity_id={{ item.activity_id }}"
                        style="text-decoration: none; color: inherit; display: block;">
                        <img src="{{ item.preview_image_url }}" alt="Preview"
                            onerror="this.src='http://localhost:9000/media/telek.png'">
                    </a>

                    <div class="card-body">
                        <a href="/network-activities/feed?activity_id={{ item.activity_id }}"
                            style="text-decoration: none; color: inherit; display: block;">
                            <div class="card-header">
                                <div class="card-wifi">⏱ {{ item.max_latency_ms }} мс</div>
                                <div class="card-likes">♡ {{ item.likes_count }}</div>
                            </div>
                            <div>
                                <p class="card-title">{{ item.activity_title }}</p>
                                <div class="card-speed">⚡ {{ item.average_traffic_mbps }} Мбит/с</div>
                            </div>
                        </a>

                        <form action="/network-activities/{{ item.activity_id }}/delete" method="POST"
                            class="card-delete-form">
                            <button type="submit" class="btn-delete-outline">Удалить</button>
                        </form>
                    </div>
                </div>
                {% else %}
                <div style="text-align: center; color: var(--text-muted); grid-column: span 2; padding: 20px;">
                    Ничего не найдено
                </div>
                {% endfor %}
            </div>

        </div>
    </div>

    <div class="bottom-bar">
        <a href="/network-activities/feed" class="tab-item">
            <svg width="19" height="12" viewBox="0 0 19 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12.6676 6.83355L17.0204 9.73522C17.0832 9.77698 17.1561 9.80093 17.2314 9.80453C17.3067 9.80813 17.3815 9.79124 17.448 9.75567C17.5144 9.7201 17.57 9.66717 17.6087 9.60252C17.6475 9.53787 17.6679 9.46392 17.668 9.38855V2.55855C17.668 2.48524 17.6487 2.41322 17.612 2.34976C17.5752 2.2863 17.5224 2.23366 17.4589 2.19714C17.3953 2.16062 17.3232 2.14152 17.2499 2.14177C17.1765 2.14202 17.1046 2.1616 17.0413 2.19855L12.6676 4.75022M2.66678 1H11.0008C11.9213 1 12.6676 1.74619 12.6676 2.66667V9.33333C12.6676 10.2538 11.9213 11 11.0008 11H2.66678C1.74624 11 0.999985 10.2538 0.999985 9.33333V2.66667C0.999985 1.74619 1.74624 1 2.66678 1Z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            Лента
        </a>
        <a href="/network-activities/draft" class="tab-item">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0.999985 6.834H12.668M6.83398 1V12.668" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
            Добавление
        </a>
        <a href="/network-activities/catalog" class="tab-item active">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M8.5 1V16M1 8.5H16M2.66667 1H14.3333C15.2538 1 16 1.74619 16 2.66667V14.3333C16 15.2538 15.2538 16 14.3333 16H2.66667C1.74619 16 1 15.2538 1 14.3333V2.66667C1 1.74619 1.74619 1 2.66667 1Z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            Плитка
        </a>
    </div>

</body>

</html>
