<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="mobile-container">
        <div class="top-nav-header">
            Управление активностью
        </div>

        <div class="page-content draft-page-content">

            {% if activity %}
            <label class="input-label">Предпросмотр медиа</label>
            <div class="media-preview-container">
                <video class="media-preview-item" autoplay loop muted playsinline
                    poster="http://localhost:9000/media/telek.png">
                    <source src="{{ activity.preview_video_url or 'http://localhost:9000/media/telek.mp4' }}"
                        type="video/mp4">
                </video>
                <img class="media-preview-item"
                    src="{{ activity.preview_image_url or 'http://localhost:9000/media/telek.png' }}" alt="Preview"
                    onerror="this.src='http://localhost:9000/media/telek.png'">
            </div>

            <form action="/network-activities/publish" method="POST" class="draft-form">
                <input type="hidden" name="activity_id" value="{{ activity.id }}">

                <label class="input-label">Название профиля</label>
                <div class="custom-box">
                    {{ activity.activity_title }}
                </div>

                <label class="input-label">Краткая информация</label>
                <textarea name="activity_description" class="draft-input" rows="3" placeholder="Введите описание..."
                    required>{{ activity.activity_description if activity.activity_description != '' else '' }}</textarea>

                <label class="input-label">Средний трафик (Мбит/с)</label>
                <input type="number" name="average_traffic_mbps" class="draft-input"
                    value="{{ activity.average_traffic_mbps }}" required>

                <label class="input-label">Макс. задержка (мс)</label>
                <input type="number" name="max_latency_ms" class="draft-input" value="{{ activity.max_latency_ms }}"
                    required>

                <button type="submit" class="btn-save-outline">Опубликовать</button>
            </form>

            {% else %}
            <label class="input-label">Предпросмотр (по умолчанию)</label>
            <div class="media-preview-container">
                <video class="media-preview-item" autoplay loop muted playsinline>
                    <source src="http://localhost:9000/media/telek.mp4" type="video/mp4">
                </video>
                <img class="media-preview-item" src="http://localhost:9000/media/telek.png" alt="Preview">
            </div>

            <form action="/network-activities/create" method="POST" class="draft-form">
                <label class="input-label">Название профиля</label>
                <input type="text" name="activity_title" class="draft-input" placeholder="Новая активность" required>

                <button type="submit" class="btn-save-outline">Далее</button>
            </form>
            {% endif %}

        </div>
    </div>


    <div class="bottom-bar">
        <a href="/network-activities/feed" class="tab-item">
            <svg width="19" height="12" viewBox="0 0 19 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12.6676 6.83355L17.0204 9.73522C17.0832 9.77698 17.1561 9.80093 17.2314 9.80453C17.3067 9.80813 17.3815 9.79124 17.448 9.75567C17.5144 9.7201 17.57 9.66717 17.6087 9.60252C17.6475 9.53787 17.6679 9.46392 17.668 9.38855V2.55855C17.668 2.48524 17.6487 2.41322 17.612 2.34976C17.5752 2.2863 17.5224 2.23366 17.4589 2.19714C17.3953 2.16062 17.3232 2.14152 17.2499 2.14177C17.1765 2.14202 17.1046 2.1616 17.0413 2.19855L12.6676 4.75022M2.66678 1H11.0008C11.9213 1 12.6676 1.74619 12.6676 2.66667V9.33333C12.6676 10.2538 11.9213 11 11.0008 11H2.66678C1.74624 11 0.999985 10.2538 0.999985 9.33333V2.66667C0.999985 1.74619 1.74624 1 2.66678 1Z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            Лента
        </a>
        <a href="/network-activities/draft" class="tab-item active">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0.999985 6.834H12.668M6.83398 1V12.668" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
            Добавление
        </a>
        <a href="/network-activities/catalog" class="tab-item">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M8.5 1V16M1 8.5H16M2.66667 1H14.3333C15.2538 1 16 1.74619 16 2.66667V14.3333C16 15.2538 15.2538 16 14.3333 16H2.66667C1.74619 16 1 15.2538 1 14.3333V2.66667C1 1.74619 1.74619 1 2.66667 1Z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            Плитка
        </a>
    </div>
    </div>
</body>

</html>
